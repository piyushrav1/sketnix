name: Keep Alive Ping

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Sketnix health endpoint
        env:
          SPACE_URL: ${{ secrets.SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "SPACE_URL secret is not set; skipping ping."
            exit 0
          fi
          curl -fsS -m 20 "${SPACE_URL%/}/api/health"
          echo ""

